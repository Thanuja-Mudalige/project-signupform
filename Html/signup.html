<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="../Css/signup.css">
    <title>Signup form</title>
   
</head>
<body>

    <div class="ImageContainer">
        <div class="title">
        <img src="../Images/odin-lined.png" class="odinimage" alt="odin-Image">
        <p class="odintitle">ODIN</p>
        </div>
    </div>
    <div class="formContainer">

        <div class="header">
            <p>This is not a real online service!You know you need something<br>
            like this in your life to help you realize your deepest dreams.<br>
            Sign up <li>now</li> to get started <br>
            <br>
            You know you want to</p>
        </div>
    <form>
        <div class="forminput-section">
            
                <div class="form-left">
                    <label for="firstname">FIRST NAME</label>
                    <input type="text" id="firstname" name="firstname">

                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email">

                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password">
                </div>


                <div class="form-left">
                    <label for="lastname">LAST NAME</label>
                    <input type="text" id="lastname" name="lastname">

                    <label for="phonenumber">PHONE NUMBER</label>
                    <input type="tel" id="phonenumber" name="phone">

                    <label for="confirmpassword">CONFIRM PASSWORD</label>
                    <input type="password" id="confirmpassword" name="confirmpassword">
                </div>     
            
        </div>

        <button type="submit">Create Account</button>

    </form>
    
    <p>Already have an account? <a href="" target="_blank" rel="noreferrer">Log in</a></p>

    </div>

    
    
</body>
</html>
